name: Build Android TV APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build GeckoView armeabi-v7a APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --info --stacktrace :app:assembleLegacyDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Gradle build failed; last output follows"
            tail -n 160 build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-browser-armeabi-v7a-geckoview-debug
          path: app/build/outputs/apk/legacy/debug/*.apk
          if-no-files-found: error

      - name: Publish test APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/legacy/debug/*.apk tv-browser-armeabi-v7a-geckoview-debug.apk
          split -b 10M -d -a 2 tv-browser-armeabi-v7a-geckoview-debug.apk tv-browser-gecko.part-
          sha256sum tv-browser-armeabi-v7a-geckoview-debug.apk > tv-browser-gecko.sha256
          if gh release view legacy-geckoview >/dev/null 2>&1; then
            gh release upload legacy-geckoview \
              tv-browser-armeabi-v7a-geckoview-debug.apk \
              tv-browser-gecko.part-* \
              tv-browser-gecko.sha256 \
              --clobber
          else
            gh release create legacy-geckoview \
              tv-browser-armeabi-v7a-geckoview-debug.apk \
              tv-browser-gecko.part-* \
              tv-browser-gecko.sha256 \
              --title "玩客云 GeckoView 测试版" \
              --notes "面向 Android 5.0+、32 位 ARM 设备的内置 GeckoView 版本。"
          fi
