name: Build Android TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build GeckoView armeabi-v7a APK
        run: gradle --no-daemon :app:assembleLegacyDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-browser-armeabi-v7a-geckoview-debug
          path: app/build/outputs/apk/legacy/debug/*.apk
          if-no-files-found: error
