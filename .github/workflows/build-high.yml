name: Build High Version Android TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-high.yml'

permissions:
  contents: write

jobs:
  build-high:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build arm64-v8a high version APK
        run: gradle --no-daemon :app:assembleHighDebug

      - name: Upload high version APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-browser-arm64-v8a-high-debug
          path: app/build/outputs/apk/high/debug/*.apk
          if-no-files-found: error

      - name: Publish high version APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arm64-geckoview
          name: N1 ARM64 小体积看板版本
          body: 兼容 Android 7.1/API 25，使用系统 WebView，支持设置首页地址。
          files: app/build/outputs/apk/high/debug/*.apk
          make_latest: false
