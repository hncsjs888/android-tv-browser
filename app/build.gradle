plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ykq.tvbrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ykq.tvbrowser'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
