plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ykq.tvbrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ykq.tvbrowser'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    flavorDimensions += 'device'

    productFlavors {
        legacy {
            dimension 'device'
            minSdk 21
            targetSdk 28
            versionNameSuffix '-legacy-gecko'
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }

        high {
            dimension 'device'
            applicationIdSuffix '.high'
            versionNameSuffix '-high'
            minSdk 26
            targetSdk 35
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    legacyImplementation 'org.mozilla.geckoview:geckoview-armeabi-v7a:128.0.20240704121409'
}
